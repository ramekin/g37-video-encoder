[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g37-video-encoder"
version = "1.1.0"
description = "Encode videos for 2012 Infiniti G37x with Navigation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Chris Rasmussen"}
]
keywords = ["video", "encoder", "g37", "infiniti", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.scripts]
g37-encode = "g37_encoder.cli:main"

[project.urls]
Homepage = "https://github.com/ramekin/g37-video-encoder"

[tool.setuptools.packages.find]
where = ["."]
include = ["g37_encoder*"]
